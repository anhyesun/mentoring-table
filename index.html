<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>창발 멘토링 데이 2026 테이블 배정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5FA; --paper:#FFFFFF; --ink:#22224A; --muted:#7C7C9C; --line:#C9C9DE;
  --accent:#5B4FD6; --accent-ink:#FFFFFF; --accent-soft:#ECEAFD; --chair:#B3B3CC;
  --wall:#22224A; --door:#9A9AB5;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15152A; --paper:#1E1E38; --ink:#E7E7F5; --muted:#9A9ABD; --line:#3A3A5E;
    --accent:#8E84F5; --accent-ink:#15152A; --accent-soft:#2C2A55; --chair:#4A4A70;
    --wall:#C9C9E6; --door:#6E6E95; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15152A; --paper:#1E1E38; --ink:#E7E7F5; --muted:#9A9ABD; --line:#3A3A5E;
  --accent:#8E84F5; --accent-ink:#15152A; --accent-soft:#2C2A55; --chair:#4A4A70;
  --wall:#C9C9E6; --door:#6E6E95; color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px; margin:0 auto; padding:28px 20px 48px}
header h1{font-size:clamp(26px,4.5vw,38px); line-height:1.15; margin:0 0 6px; font-weight:700; letter-spacing:-0.02em}
header p{margin:0; color:var(--muted)}

.layout{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:28px; margin-top:24px; align-items:start}

/* Room */
.room-frame{position:relative; padding-left:14px}
.room{
  position:relative; background:var(--paper); border:3px solid var(--wall);
  display:grid; grid-template-columns:minmax(28px,0.55fr) repeat(4,minmax(0,1fr));
  grid-template-rows:repeat(5,auto); gap:clamp(6px,2vw,18px) clamp(4px,1.6vw,16px);
  padding:clamp(10px,2.4vw,24px) clamp(8px,2vw,22px) clamp(10px,2.4vw,24px) clamp(6px,1.5vw,14px);
}
.door{position:absolute; left:-1px; width:14px; height:9%; border-top:2px solid var(--door); border-left:3px solid var(--bg);}
.door::after{content:""; position:absolute; left:-14px; top:-2px; width:28px; height:100%; border:2px solid var(--door); border-left:none; border-bottom:none; border-radius:0 100% 0 0; transform-origin:top left;}
.door span{position:absolute; left:-12px; top:50%; transform:translate(-100%,-50%); font-size:11px; color:var(--muted); white-space:nowrap}
.board{position:absolute; left:3px; width:5px; background:var(--line); border-radius:1px}
.podium{grid-column:1; grid-row:3; align-self:center; justify-self:center; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--muted); font-size:11px; text-align:center}
.podium i{display:block; width:clamp(14px,2.4vw,22px); height:clamp(20px,3.4vw,30px); border:2px solid var(--muted); border-radius:5px}

.tbl{
  appearance:none; background:none; border:0; padding:0; margin:0; cursor:pointer; color:inherit; font:inherit;
  display:grid; grid-template-columns:0 1fr auto; grid-template-rows:auto 1fr auto; gap:3px; column-gap:0;
  width:100%; border-radius:8px; outline-offset:4px;
}
.tbl:focus-visible{outline:3px solid var(--accent)}
.chairs{display:flex; gap:clamp(3px,0.6vw,6px); justify-content:center}
.chairs.v{flex-direction:column; justify-content:center}
.chairs b{display:block; width:clamp(10px,2vw,19px); height:clamp(10px,2vw,19px); border:2px solid var(--chair); border-radius:50%}
.c-top{grid-column:2; grid-row:1} .c-bot{grid-column:2; grid-row:3}
.c-right{grid-column:3; grid-row:2; margin-left:3px}
.top{
  grid-column:2; grid-row:2; aspect-ratio:1/1; border:2px solid var(--ink); border-radius:3px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative;
  font-weight:700; font-size:clamp(14px,2.6vw,24px); font-variant-numeric:tabular-nums;
  transition:background-color .15s, color .15s, border-color .15s;
}
.top::before{content:""; position:absolute; top:0; bottom:0; left:50%; border-left:1px solid var(--line)}
.top em{position:relative; font-style:normal; background:var(--paper); padding:0 2px; line-height:1}
@media (hover:hover){
  .tbl:hover .top{background:var(--accent-soft)}
  .tbl:hover .top em, .tbl:hover .top .tlogo{background:var(--accent-soft)}
}
.tbl.tbd .top{border-style:dashed; border-color:var(--muted); color:var(--muted); font-weight:500}
.tbl[aria-pressed="true"] .top{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.tbl[aria-pressed="true"] .top::before{border-color:transparent}
.tbl[aria-pressed="true"] .top em{background:var(--accent)}
.tbl[aria-pressed="true"] .chairs b{border-color:var(--accent)}
.tbl.dim{opacity:.22}
.chairs b.mentor{background:var(--ink); border-color:var(--ink)}
.chairs b.taken{background:var(--accent); border-color:var(--accent)}
.roundbar{display:flex; gap:6px; margin:0 0 12px; flex-wrap:wrap; align-items:center}
.roundbar button{appearance:none; font:inherit; font-size:14px; font-weight:500; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); padding:7px 14px; border-radius:999px; cursor:pointer; touch-action:manipulation}
.roundbar button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.roundbar button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.roundbar span{color:var(--muted); font-size:14px; margin-left:4px}
.legend b{width:13px; height:13px; border:2px solid var(--chair); border-radius:50%; display:inline-block}
.legend b.taken{background:var(--accent); border-color:var(--accent)}
.legend b.mentor{background:var(--ink); border-color:var(--ink)}
.signup{margin-top:20px; padding-top:4px; border-top:1px solid var(--line)}
#detail > .signup{grid-column:1 / -1}
.signup h3{margin:12px 0 2px; font-size:16px}
.slot{padding:12px 0; border-bottom:1px solid var(--line)}
.slot:last-of-type{border-bottom:0}
.slot-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap}
.slot-name{font-weight:700}
.slot-time{color:var(--muted); font-size:14px}
.seats{display:flex; gap:6px; margin:8px 0 4px}
.seats i{width:22px; height:22px; border-radius:6px; border:2px solid var(--line)}
.seats i.on{background:var(--accent); border-color:var(--accent)}
.left{font-size:14px; margin:0}
.left.full{color:var(--muted)}
.names{list-style:none; margin:6px 0 0; padding:0; font-size:14px}
.names li{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:3px 0}
.names button{appearance:none; border:0; background:none; color:var(--muted); font:inherit; font-size:13px; cursor:pointer; text-decoration:underline; padding:4px 0}
.joinbtn{appearance:none; border:1.5px solid var(--accent); background:var(--accent); color:var(--accent-ink); font:inherit; font-weight:500; font-size:14px; padding:8px 18px; border-radius:999px; cursor:pointer; margin-top:8px; touch-action:manipulation}
.joinbtn:disabled{background:var(--line); border-color:var(--line); color:var(--muted); cursor:not-allowed}
.joinbtn.ghost{background:none; color:var(--ink); border-color:var(--line)}
.joinbtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.form{display:grid; gap:8px; margin-top:10px}
.form input{font:inherit; font-size:16px; color:var(--ink); background:var(--bg); border:1.5px solid var(--line); border-radius:10px; padding:9px 11px; width:100%}
.form input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.form .row{display:flex; gap:8px; flex-wrap:wrap}
.form .row2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.form .row .joinbtn{margin-top:0}
.msg{font-size:13px; margin:6px 0 0; color:var(--accent)}
.msg.err{color:#D14343}
.note{font-size:12px; color:var(--muted); margin:10px 0 0}
.who{font-size:13px; color:var(--muted); margin:4px 0 0; line-height:1.5}
.mine{display:inline-block; margin-left:6px; padding:1px 7px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:11px; font-weight:500}
.legend{display:flex; gap:18px; flex-wrap:wrap; margin-top:12px; font-size:13px; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:14px; height:14px; border:2px solid var(--ink); border-radius:2px; display:inline-block}
.legend i.d{border-style:dashed; border-color:var(--muted)}

/* Detail panel */
.panel{position:sticky; top:calc(env(safe-area-inset-top,0px) + 16px); background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:22px; max-height:calc(100vh - 32px); overflow:auto}
.panel .num{font-size:15px; color:var(--muted); margin:0 0 14px}
.panel .num strong{color:var(--accent); font-size:44px; line-height:1; display:block; font-variant-numeric:tabular-nums; letter-spacing:-0.02em}
.panel .avatar{border-radius:50%; overflow:hidden}
.panel .photo{display:block; width:96px; height:96px; border-radius:50%; object-fit:cover; margin:0 0 14px; border:3px solid var(--accent-soft)}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%; word-break:keep-all; overflow-wrap:break-word}
.tbl,.list button,.panel .close{touch-action:manipulation; -webkit-tap-highlight-color:transparent}
.scrim{display:none; position:fixed; inset:0; background:rgba(20,20,50,.35); z-index:15; opacity:0; pointer-events:none; transition:opacity .2s}
.scrim.open{opacity:1; pointer-events:auto}
.panel .logo{display:inline-flex; align-items:center; margin:12px 0 8px; justify-self:start}
.panel .logo img{height:22px; width:auto}
.lg-d{display:none !important}
.lg-l{display:block}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .lg-l{display:none !important} :root:not([data-theme="light"]) .lg-d{display:block !important} }
:root[data-theme="dark"] .lg-l{display:none !important} :root[data-theme="dark"] .lg-d{display:block !important}
.tbl[aria-pressed="true"] .lg-l{display:none !important} .tbl[aria-pressed="true"] .lg-d{display:block !important}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tbl[aria-pressed="true"] .lg-l{display:block !important} :root:not([data-theme="light"]) .tbl[aria-pressed="true"] .lg-d{display:none !important} }
:root[data-theme="dark"] .tbl[aria-pressed="true"] .lg-l{display:block !important} :root[data-theme="dark"] .tbl[aria-pressed="true"] .lg-d{display:none !important}
.top .tlogo{position:relative; display:flex; justify-content:center; width:78%; margin-top:clamp(3px,0.8vw,8px); background:var(--paper); padding:1px 0}
.top .tlogo img{max-width:100%; height:clamp(9px,1.6vw,15px); width:auto; object-fit:contain}
.top .tlogo img.sq{height:clamp(16px,2.8vw,28px)}
.panel .logo img.sq{height:36px}
.tbl[aria-pressed="true"] .top .tlogo{background:var(--accent)}
.panel h2{margin:0; font-size:24px; line-height:1.25; letter-spacing:-0.01em}
.panel .co{margin:6px 0 2px; color:var(--accent); font-weight:500}
.panel .field{margin:0; color:var(--ink)}
.panel .empty{color:var(--muted); margin:0}
.panel a.li{display:inline-block; margin-top:16px; padding:9px 14px; border-radius:999px; background:var(--accent-soft); color:var(--ink); font-weight:500; font-size:14px; text-decoration:none}
.panel a.li:hover{background:var(--accent); color:var(--accent-ink)}
.panel a.li:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.panel .close{display:none}

.search{margin-top:24px}
.search label{display:block; font-weight:500; margin-bottom:6px}
.search input{
  width:100%; font:inherit; color:var(--ink); background:var(--paper);
  border:1.5px solid var(--line); border-radius:10px; padding:10px 12px;
}
.search input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.list{list-style:none; margin:12px 0 0; padding:0; columns:2 260px; column-gap:24px}
.list li{break-inside:avoid}
.list button{
  appearance:none; background:none; border:0; font:inherit; color:inherit; cursor:pointer; text-align:left;
  width:100%; display:grid; grid-template-columns:2.2em 1fr; gap:4px; padding:7px 6px; border-radius:8px;
}
@media (hover:hover){ .list button:hover{background:var(--accent-soft)} }
.list button:focus-visible{outline:2px solid var(--accent)}
.list .n{color:var(--muted); font-variant-numeric:tabular-nums}
.list .sub{display:block; color:var(--muted); font-size:13px}
.list li[hidden]{display:none}
.list .tbdname{color:var(--muted)}
.noresult{color:var(--muted); margin:12px 0 0}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .panel{
    position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); top:auto; z-index:20;
    box-shadow:0 10px 40px rgba(20,20,60,.25); padding:18px 18px 16px;
    transform:translateY(calc(100% + 40px)); visibility:hidden;
    transition:transform .22s ease-out, visibility 0s linear .22s;
    max-height:min(var(--peek, 100dvh), calc(100dvh - 80px)); overflow:auto; overscroll-behavior:contain;
  }
  .panel.open{transform:none; visibility:visible; transition:transform .22s ease-out, max-height .2s ease-out}
  .panel.expanded{max-height:calc(100dvh - 80px)}
  .panel::before{content:""; display:block; width:36px; height:4px; border-radius:2px; background:var(--line); margin:-8px auto 12px}
  .scrim{display:block}
  .wrap{padding:18px 14px 32px}
  header h1{font-size:24px}
  header p{font-size:14px}
  .layout{margin-top:16px; gap:20px}
  .room-frame{padding-left:8px}
  .room{grid-template-columns:20px repeat(4,minmax(0,1fr)); gap:12px 8px; padding:14px 10px 14px 4px}
  .podium{font-size:0; gap:0}
  .podium i{width:12px; height:16px; border-width:1.5px}
  .tbl{gap:2px}
  .chairs{gap:3px}
  .chairs b{width:12px; height:12px; border-width:1.5px}
  .top{font-size:17px; border-width:1.5px}
  .legend{font-size:12px; gap:14px}
  .search{margin-top:20px}
  .list{columns:1}
  .list button{padding:10px 6px}
  #detail{display:grid; grid-template-columns:72px 1fr; column-gap:14px; align-items:start}
  #detail > *{grid-column:2}
  #detail > .num, #detail > .hint{grid-column:1 / -1}
  #detail > .photo{grid-column:1; grid-row:2 / span 5; width:72px; height:72px; margin:0}
  #detail:not(:has(.photo)) > *{grid-column:1 / -1}
  .panel .num{margin:0 0 12px; padding-right:64px}
  .panel .num strong{display:inline; font-size:22px; margin-right:6px}
  .panel h2{font-size:20px}
  .panel .co{margin-top:2px}
  .panel a.li{margin-top:12px; padding:11px 16px}
  .panel .close{
    display:block; position:absolute; top:10px; right:10px; appearance:none; border:0; background:var(--accent-soft);
    color:var(--ink); font:inherit; font-size:14px; padding:6px 12px; border-radius:999px; cursor:pointer;
  }
  .panel .hint{display:none}
  .door span{display:none}
}
@media (prefers-reduced-motion:reduce){ .panel,.top{transition:none} }
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>창발 멘토링 데이 2026 테이블 배정</h1>
    <p>Health Sciences Education Building 345. 테이블을 누르면 멘토를 볼 수 있어요.</p>
  </header>

  <div class="layout">
    <div>
      <div class="roundbar" role="group" aria-label="라운드 선택">
        <button type="button" data-round="1" aria-pressed="true">Round 1</button>
        <button type="button" data-round="2" aria-pressed="false">Round 2</button>
        <span id="roundtime">3:30 – 4:30 PM</span>
      </div>
      <div class="room-frame">
        <div class="room" id="room" aria-label="강의실 배치도">
          <div class="door" style="top:3%"><span>출입구</span></div>
          <div class="board" style="top:17%;height:21%"></div>
          <div class="door" style="top:51%"><span>출입구</span></div>
          <div class="board" style="top:61%;height:21%"></div>
          <div class="podium"><i></i>포디엄</div>
        </div>
      </div>
      <div class="legend">
        <span><i></i>멘토 배정됨</span>
        <span><i class="d"></i>멘토 미정</span>
        <span><b class="mentor"></b>멘토</span>
        <span><b class="taken"></b>신청된 자리</span>
        <span><b></b>빈 자리</span>
      </div>

      <div class="search">
        <label for="q">멘토 찾기</label>
        <input id="q" type="search" placeholder="이름, 회사, 분야로 검색" autocomplete="off">
        <ul class="list" id="list"></ul>
        <p class="noresult" id="noresult" hidden>검색어와 맞는 멘토가 없어요. 다른 단어로 찾아보세요.</p>
      </div>
    </div>

    <div class="scrim" id="scrim"></div>
    <aside class="panel" id="panel" aria-live="polite">
      <button class="close" id="close" type="button">닫기</button>
      <div id="detail">
        <p class="num"><strong>?</strong>테이블</p>
        <p class="empty hint">배치도에서 테이블을 눌러 멘토를 확인하세요.</p>
      </div>
    </aside>
  </div>
</div>

const HAS_PHOTO = new Set(["Insuk Cho","Hoyeon Park","Hyunsoo Choe","Jusung Park","Youngwon Kim","DongKyu Kim","Minkwon Choi","Henry Kim","Ethan Hong","Jason Park","Hyunuk Lim","Minji Woo","Ryan Lee","Hyesun An"]);
const LOGO_KEYS = ["Microsoft","Amazon","Google","Truveta","Elastic","Pinterest","Meta","JIGO","The Home Depot"];
const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const logoKey = co => LOGO_KEYS.find(k => co === k || co.startsWith(k + " "));
const logoImgs = (co, alt) => {
  const k = logoKey(co); if (!k) return "";
  const sq = k === "The Home Depot" ? " sq" : "";
  return `<img class="lg-l${sq}" src="${A}logos/${slug(k)}-on-light.png" alt="${alt}"><img class="lg-d${sq}" src="${A}logos/${slug(k)}-on-dark.png" alt="" aria-hidden="true">`;
};
const AVATAR = `<svg class="photo avatar" viewBox="0 0 96 96" width="96" height="96" aria-hidden="true"><circle cx="48" cy="48" r="48" fill="var(--accent-soft)"/><circle cx="48" cy="38" r="15" fill="var(--accent)" opacity=".5"/><path d="M19 82c3-14 14-22 29-22s26 8 29 22a48 48 0 0 1-58 0z" fill="var(--accent)" opacity=".5"/></svg>`;

// ===== 공통 =====
const room = document.getElementById('room');
const list = document.getElementById('list');
const panel = document.getElementById('panel');
const detail = document.getElementById('detail');
const q = document.getElementById('q');
const noresult = document.getElementById('noresult');
const scrim = document.getElementById('scrim');
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chairs = (cls) => `<span class="chairs ${cls}"><b></b><b></b></span>`;

// ===== 상태 =====
const counts = {};                 // "테이블-라운드" -> 신청 수 (서버 값)
const whoMap = {};                 // "테이블-라운드" -> 신청자 first name 목록 (서버 값)
const takenOf = (n, r) => counts[n + '-' + r] || 0;
let mine = [];                     // 이 기기에서 신청한 것 {id, token, table, round, name}
try { mine = JSON.parse(localStorage.getItem(MY_KEY) || '[]') || []; } catch (e) { mine = []; }
function saveMine(){ try { localStorage.setItem(MY_KEY, JSON.stringify(mine)); } catch (e) {} }
let sb = null;
let status = 'loading';            // loading | online | error
let busy = false;
let viewRound = 1;
let openForm = null;
let flash = null;
let current = 0;

// ===== 배치도 =====
const tables = MENTORS.map((m, i) => {
  const n = i + 1;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'tbl' + (m ? '' : ' tbd');
  btn.style.gridColumn = (i % COLS) + 2;
  btn.style.gridRow = Math.floor(i / COLS) + 1;
  btn.setAttribute('aria-pressed', 'false');
  btn.setAttribute('aria-label', `${n}번 테이블` + (m ? `, ${m.name}` : ', 멘토 미정'));
  btn.innerHTML = chairs('c-top') +
    `<span class="top"><em>${pad(n)}</em>${m && logoKey(m.co) ? `<span class="tlogo">${logoImgs(m.co, "")}</span>` : ""}</span>` +
    chairs('v c-right') + chairs('c-bot');
  btn.addEventListener('click', () => select(n, true));
  room.appendChild(btn);
  return btn;
});

MENTORS.forEach((m, i) => {
  const n = i + 1;
  const li = document.createElement('li');
  li.dataset.text = m ? `${m.name} ${m.co} ${m.field} ${n}`.toLowerCase() : `${n} tbd 미정`;
  li.innerHTML = `<button type="button"><span class="n">${pad(n)}</span><span>` +
    (m ? `${esc(m.name)}<span class="sub">${esc(m.co)}, ${esc(m.field)}</span><span class="sub avail" data-n="${n}"></span>`
       : `<span class="tbdname">미정</span>`) + `</span></button>`;
  li.querySelector('button').addEventListener('click', () => {
    select(n, true);
    tables[n - 1].scrollIntoView({block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  });
  list.appendChild(li);
});

function paintSeats(){
  const MENTOR_SEAT = 2; // 오른쪽 의자 중 윗자리 (DOM 순서: 위 2, 오른쪽 2, 아래 2)
  tables.forEach((t, i) => {
    const n = i + 1, m = MENTORS[i];
    const bs = t.querySelectorAll('.chairs b');
    bs.forEach(b => b.className = '');
    if (!m) return;
    bs[MENTOR_SEAT].className = 'mentor';
    const taken = takenOf(n, viewRound);
    [...bs].filter((_, k) => k !== MENTOR_SEAT).forEach((b, k) => { if (k < taken) b.className = 'taken'; });
    const left = CAP - taken;
    t.setAttribute('aria-label', `${n}번 테이블, ${m.name}` + (status === 'online' ? `, Round ${viewRound} ` + (left > 0 ? `${left}자리 남음` : '마감') : ''));
  });
  document.querySelectorAll('.avail').forEach(el => {
    const n = +el.dataset.n;
    if (status !== 'online') { el.textContent = ''; return; }
    const txt = r => { const l = CAP - takenOf(n, r); return l > 0 ? `Round ${r} ${l}자리 남음` : `Round ${r} 마감`; };
    el.textContent = txt(1) + ', ' + txt(2);
  });
}

// ===== 신청 영역 =====
function renderSignup(n){
  const box = document.getElementById('signup');
  if (!box) return;
  // 실시간 갱신 중에도 입력 중인 내용이 지워지지 않도록 보존
  const keep = {};
  box.querySelectorAll('.form input').forEach(inp => keep[inp.dataset.f] = inp.value);
  const focused = document.activeElement && box.contains(document.activeElement) ? document.activeElement.dataset.f : null;

  if (status !== 'online') {
    box.innerHTML = '<h3>멘토링 신청</h3>' + (status === 'loading'
      ? '<p class="note">남은 자리를 불러오는 중이에요.</p>'
      : '<p class="msg err">신청 서버에 연결하지 못했어요. 잠시 후 새로고침해 주세요.</p>');
    return;
  }
  box.innerHTML = '<h3>멘토링 신청</h3>' + [1, 2].map(r => {
    const taken = takenOf(n, r), left = CAP - taken;
    const seats = Array.from({length: CAP}, (_, i) => `<i class="${i < taken ? 'on' : ''}"></i>`).join('');
    const my = mine.filter(x => x.table === n && x.round === r);
    const names = my.length ? `<ul class="names">${my.map(x => `<li><span>${esc(x.name)} <span class="mine">내 신청</span></span><button type="button" data-cancel="${esc(x.id)}">신청 취소</button></li>`).join('')}</ul>` : '';
    const action = (openForm === r && left > 0)
      ? `<div class="form" data-round="${r}"><div class="row2"><input data-f="first" placeholder="First Name" autocomplete="given-name" autocapitalize="words" aria-label="First Name"><input data-f="last" placeholder="Last Name" autocomplete="family-name" autocapitalize="words" aria-label="Last Name"></div><div class="row"><button class="joinbtn" type="button" data-submit${busy ? ' disabled' : ''}>${busy ? '신청 중…' : '신청하기'}</button><button class="joinbtn ghost" type="button" data-close>닫기</button></div><p class="msg" aria-live="polite"></p></div>`
      : `<button class="joinbtn" type="button" data-open="${r}"${left <= 0 ? ' disabled' : ''}>${left <= 0 ? '마감' : `Round ${r} 신청`}</button>`;
    const fl = (flash && flash.r === r) ? `<p class="msg${flash.err ? ' err' : ''}">${esc(flash.text)}</p>` : '';
    return `<div class="slot"><div class="slot-head"><span class="slot-name">Round ${r}</span><span class="slot-time">${ROUNDS[r]}</span></div>` +
      `<div class="seats" aria-hidden="true">${seats}</div>` +
      `<p class="left${left <= 0 ? ' full' : ''}">${left > 0 ? `${left}자리 남음 (${taken}/${CAP})` : `마감 (${CAP}/${CAP})`}</p>` +
      ((whoMap[n + '-' + r] || []).length ? `<p class="who">신청: ${esc((whoMap[n + '-' + r]).join(', '))}</p>` : '') +
      names + action + fl + `</div>`;
  }).join('');

  box.querySelectorAll('.form input').forEach(inp => { if (keep[inp.dataset.f] != null) inp.value = keep[inp.dataset.f]; });
  if (focused) { const el = box.querySelector(`[data-f="${focused}"]`); if (el) el.focus(); }
}
function refresh(){ paintSeats(); renderSignup(current); }

function errorText(message, r){
  const m = String(message || '');
  if (m.includes('SAME_MENTOR')) {
    const other = +m.split('SAME_MENTOR:')[1];
    return other
      ? `이미 Round ${other}에 이 멘토와 만나도록 신청돼 있어요. 다른 멘토를 골라 주세요.`
      : '이미 다른 라운드에 이 멘토와 만나도록 신청돼 있어요. 다른 멘토를 골라 주세요.';
  }
  if (m.includes('DUPLICATE:')) { const t = +m.split('DUPLICATE:')[1]; return `이미 Round ${r}에 ${pad(t)}번 테이블로 신청돼 있어요.`; }
  if (m.includes('DUPLICATE')) return '이미 이 라운드에 신청돼 있어요.';
  if (m.includes('FULL')) return '이 라운드는 이미 마감됐어요.';
  if (m.includes('NAME_REQUIRED')) return 'First Name과 Last Name을 모두 입력해 주세요.';
  if (m.includes('NO_MENTOR') || m.includes('INVALID_SLOT')) return '이 테이블은 아직 신청을 받지 않아요.';
  return '신청하지 못했어요. 연결을 확인하고 다시 시도해 주세요.';
}

async function submitForm(f){
  if (busy || !sb) return;
  const r = +f.dataset.round, n = current;
  const firstEl = f.querySelector('[data-f="first"]'), lastEl = f.querySelector('[data-f="last"]');
  const msg = f.querySelector('.msg');
  const fail = t => { msg.textContent = t; msg.className = 'msg err'; };
  const first = firstEl.value.trim().replace(/\s+/g, ' '), last = lastEl.value.trim().replace(/\s+/g, ' ');
  if (!first) { fail('First Name을 입력해 주세요.'); firstEl.focus(); return; }
  if (!last) { fail('Last Name을 입력해 주세요.'); lastEl.focus(); return; }
  const name = first + ' ' + last;
  const dup = mine.find(x => x.round === r && x.name.toLowerCase() === name.toLowerCase());
  if (dup) { fail(`이미 Round ${r}에 ${pad(dup.table)}번 테이블로 신청돼 있어요.`); return; }
  const sameMentor = mine.find(x => x.table === n && x.round !== r && x.name.toLowerCase() === name.toLowerCase());
  if (sameMentor) { fail(`이미 Round ${sameMentor.round}에 이 멘토와 만나도록 신청돼 있어요. 다른 멘토를 골라 주세요.`); return; }

  busy = true; renderSignup(current);
  const { data, error } = await sb.rpc('sign_up', { p_table: n, p_round: r, p_first: first, p_last: last });
  busy = false;
  if (error) {
    renderSignup(current);
    const m2 = detail.querySelector('.form .msg');
    if (m2) { m2.textContent = errorText(error.message, r); m2.className = 'msg err'; }
    loadCounts();
    return;
  }
  const row = Array.isArray(data) ? data[0] : data;
  mine.push({ id: row.signup_id, token: row.cancel_token, table: n, round: r, name });
  saveMine();
  counts[n + '-' + r] = Math.min(CAP, takenOf(n, r) + 1); // 실시간 값이 오면 그 값으로 덮어씀
  whoMap[n + '-' + r] = [...(whoMap[n + '-' + r] || []), first];
  openForm = null;
  flash = { r, text: `${name}님, Round ${r} 신청이 완료됐어요.` };
  refresh();
}

async function cancelMine(id){
  const item = mine.find(x => x.id === id);
  if (!item || !sb) return;
  const { error } = await sb.rpc('cancel_signup', { p_id: item.id, p_token: item.token });
  if (error) { flash = { r: item.round, text: '취소하지 못했어요. 다시 시도해 주세요.', err: true }; refresh(); return; }
  mine = mine.filter(x => x.id !== id);
  saveMine();
  flash = { r: item.round, text: `${item.name}님의 Round ${item.round} 신청을 취소했어요.` };
  await loadCounts();
}

detail.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.open) {
    openForm = +b.dataset.open; flash = null; renderSignup(current); panel.classList.add('expanded');
    const inp = detail.querySelector('.form input'); if (inp) inp.focus();
  } else if ('close' in b.dataset) {
    openForm = null; renderSignup(current);
  } else if ('submit' in b.dataset) {
    submitForm(b.closest('.form'));
  } else if (b.dataset.cancel) {
    if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = '정말 취소할까요?'; return; }
    b.disabled = true; cancelMine(b.dataset.cancel);
  }
});
detail.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('.form input')) { e.preventDefault(); submitForm(e.target.closest('.form')); }
});
document.querySelectorAll('.roundbar button').forEach(b => b.addEventListener('click', () => {
  viewRound = +b.dataset.round;
  document.querySelectorAll('.roundbar button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  document.getElementById('roundtime').textContent = ROUNDS[viewRound];
  paintSeats();
}));

// ===== 상세 패널 =====
function select(n, push){
  if (current !== n) { openForm = null; flash = null; }
  current = n;
  tables.forEach((t, i) => t.setAttribute('aria-pressed', i === n - 1 ? 'true' : 'false'));
  const m = MENTORS[n - 1];
  detail.innerHTML = `<p class="num"><strong>${pad(n)}</strong>테이블</p>` +
    (m ? (HAS_PHOTO.has(m.name) ? `<img class="photo" src="${A}photos/${slug(m.name)}.jpg" alt="${esc(m.name)} 프로필 사진" width="96" height="96">` : AVATAR) +
         `<h2>${esc(m.name)}</h2>` +
         (logoKey(m.co) ? `<span class="logo">${logoImgs(m.co, esc(m.co) + " 로고")}</span>` : '') +
         (LOGO_KEYS.includes(m.co) ? '' : `<p class="co">${esc(m.co)}</p>`) +
         `<p class="field">${esc(m.field)}</p>` +
         (m.li ? `<a class="li" href="${esc(m.li)}" target="_blank" rel="noopener noreferrer">LinkedIn 프로필 열기</a>` : '') +
         '<div class="signup" id="signup"></div>'
       : `<p class="empty">이 테이블의 멘토는 아직 정해지지 않았어요.</p>`);
  if (m) renderSignup(n);
  panel.classList.add('open');
  scrim.classList.add('open');
  fitSheet();
  if (push && location.hash !== '#table-' + n) {
    try { history.replaceState(null, '', '#table-' + n); } catch (e) { location.hash = 'table-' + n; }
  }
}
function fromHash(){
  const m = /^#table-(\d{1,2})$/.exec(location.hash);
  const n = m ? +m[1] : 0;
  if (n >= 1 && n <= MENTORS.length && n !== current) select(n, false);
}
function closePanel(){ panel.classList.remove('open'); scrim.classList.remove('open'); }
function fitSheet(){
  panel.classList.remove('expanded');
  panel.scrollTop = 0;
  const su = document.getElementById('signup');
  if (!su || !matchMedia('(max-width:820px)').matches) { panel.style.removeProperty('--peek'); return; }
  panel.style.setProperty('--peek', (su.offsetTop + 50) + 'px');
}
panel.addEventListener('scroll', () => { if (panel.scrollTop > 4) panel.classList.add('expanded'); }, {passive: true});
document.getElementById('close').addEventListener('click', closePanel);
scrim.addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
window.addEventListener('hashchange', fromHash);

// ===== 검색 =====
q.addEventListener('input', () => {
  const v = q.value.trim().toLowerCase();
  let shown = 0;
  [...list.children].forEach((li, i) => {
    const hit = !v || li.dataset.text.includes(v);
    li.hidden = !hit;
    tables[i].classList.toggle('dim', !!v && !hit);
    if (hit) shown++;
  });
  noresult.hidden = shown > 0;
});

// ===== Supabase 연결 =====
async function loadCounts(){
  if (!sb) return;
  const { data, error } = await sb.from('slot_counts').select('table_no, round, taken, first_names');
  if (error) { if (status !== 'online') { status = 'error'; refresh(); } return; }
  data.forEach(row => { const k = row.table_no + '-' + row.round; counts[k] = row.taken; whoMap[k] = row.first_names || []; });
  status = 'online';
  refresh();
}
function initBackend(){
  const url = window.SUPABASE_URL, key = window.SUPABASE_ANON_KEY;
  if (!window.supabase || !url || !key || url.includes('YOUR_')) {
    console.error('config.js에 SUPABASE_URL과 SUPABASE_ANON_KEY를 넣어 주세요.');
    status = 'error'; refresh(); return;
  }
  sb = window.supabase.createClient(url, key);
  loadCounts();
  sb.channel('slot-counts')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'slot_counts' }, payload => {
      const r = payload.new; const k = r.table_no + '-' + r.round; counts[k] = r.taken; whoMap[k] = r.first_names || []; refresh();
    })
    .subscribe(s => { if (s === 'SUBSCRIBED') loadCounts(); });
  // 휴대폰이 잠들었다가 돌아오면 최신 값으로 다시 맞춤
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadCounts(); });
}

paintSeats();
fromHash();
initBackend();
</script>
</body>
